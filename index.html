<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qxvBET - Haqiqiy Zavq Makoni</title>
    <style>
        /* Asosiy CSS o'zgaruvchilari (Mavzular uchun) */
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --gold-color: #ffd700;
            --card-bg: #141414;
            --input-bg: #1f1f1f;
            --border-color: #ffd700;
        }

        .light-theme {
            --bg-color: #ffffff;
            --text-color: #000000;
            --gold-color: #b8860b;
            --card-bg: #f5f5f5;
            --input-bg: #ffffff;
            --border-color: #b8860b;
        }

        /* Umumiy reset va sozlamalar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 1. ANIMATSIYALIK SANOQ EKRANI */
        #countdown-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        #brand-name {
            font-size: 4.5rem;
            color: #ffd700;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            animation: pulse 1.5s infinite;
        }

        #timer {
            font-size: 7rem;
            color: #ffffff;
            font-weight: 800;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        #zavq-text {
            font-size: 1.5rem;
            color: #ffd700;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            animation: blink 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* TOAST BILDIRISHNOMA */
        #toast-msg {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #28a745;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            display: none;
            z-index: 100000;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* ASOSIY HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
            background: rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(5px);
        }

        .header-left {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-btn {
            color: var(--gold-color);
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 18px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            text-shadow: 0 0 8px var(--gold-color);
        }

        .active-tab {
            border-bottom: 2px solid var(--gold-color);
            padding-bottom: 5px;
        }

        /* Uchta tilla nuqta sozlamalar menyusi */
        .dots-menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 10px;
            transition: transform 0.2s;
        }

        .dots-menu:hover {
            transform: scale(1.1);
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--gold-color);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--gold-color);
        }

        .settings-dropdown {
            display: none;
            position: absolute;
            top: 75px;
            right: 40px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            z-index: 9999;
            width: 240px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .settings-dropdown h4 {
            margin-bottom: 12px;
            color: var(--gold-color);
            font-size: 16px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            padding-bottom: 5px;
        }

        .settings-dropdown label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .settings-dropdown select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            font-weight: bold;
            outline: none;
        }

        .settings-dropdown button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--gold-color);
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .settings-dropdown button:hover {
            opacity: 0.9;
        }

        /* 2. AUTH EKRANI (EMAIL BILAN BOG'LAB KIRISH) */
        #auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 2px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 25px;
            color: var(--gold-color);
            font-size: 26px;
            letter-spacing: 2px;
        }

        .auth-container input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }

        .auth-container input:focus {
            border: 2px solid var(--gold-color);
            box-shadow: 0 0 10px rgba(255,215,0,0.2);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 15px 0;
            justify-content: flex-start;
            font-size: 14px;
            cursor: pointer;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--gold-color);
            color: #000000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 18px;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
        }

        .auth-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .auth-btn:active {
            transform: translateY(1px);
        }

        /* 3. CASINO AKKAUNT EKRANI */
        #casino-screen {
            display: none;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .balance-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 40px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            margin-bottom: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .balance-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold-color);
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 26px;
            font-weight: bold;
            color: var(--text-color);
        }

        /* O'yinlar sarlavhasi */
        .section-title {
            color: var(--gold-color);
            font-size: 24px;
            margin-bottom: 25px;
            letter-spacing: 1px;
            border-left: 4px solid var(--gold-color);
            padding-left: 15px;
        }

        /* O'yinlar Gridi */
        .games-grid {
