<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qxvBET</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --gold-color: #ffd700;
            --card-bg: #1a1a1a;
        }
        .light-theme {
            --bg-color: #ffffff;
            --text-color: #000000;
            --gold-color: #b8860b;
            --card-bg: #f0f0f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); transition: background 0.3s, color 0.3s; overflow-x: hidden; }
        
        /* Sanoq Ekraani */
        #countdown-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000;
        }
        #brand-name { font-size: 3rem; color: #ffd700; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
        #timer { font-size: 5rem; color: #ffffff; font-weight: bold; }

        /* Asosiy Oyna */
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            border-bottom: 1px solid var(--gold-color); position: relative;
        }
        .header-left { display: flex; gap: 15px; }
        .nav-btn { color: var(--gold-color); font-weight: bold; cursor: pointer; background: none; border: none; font-size: 16px; }
        .nav-btn:hover { text-decoration: underline; }
        
        /* Sozlamalar va Uchta nuqta */
        .dots-menu { display: flex; gap: 5px; cursor: pointer; padding: 10px; }
        .dot { width: 8px; height: 8px; background-color: var(--gold-color); border-radius: 50%; }
        .settings-dropdown {
            display: none; position: absolute; top: 55px; right: 20px; background: var(--card-bg);
            border: 1px solid var(--gold-color); padding: 15px; border-radius: 8px; z-index: 1000; width: 200px;
        }
        .settings-dropdown h4 { margin-bottom: 10px; color: var(--gold-color); }
        .settings-dropdown select, .settings-dropdown button {
            width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid var(--gold-color);
            background: var(--bg-color); color: var(--text-color); cursor: pointer;
        }

        /* Login / Registratsiya Oynasi */
        .auth-container {
            max-width: 400px; margin: 80px auto; padding: 30px; background: var(--card-bg);
            border-radius: 12px; border: 1px solid var(--gold-color); text-align: center;
        }
        .auth-container h2 { margin-bottom: 20px; color: var(--gold-color); }
        .auth-container input {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--gold-color);
            background: var(--bg-color); color: var(--text-color); border-radius: 6px;
        }
        .remember-me { display: flex; align-items: center; gap: 10px; margin: 10px 0; justify-content: flex-start; }
        .remember-me input { width: auto; }
        .auth-btn {
            width: 100%; padding: 12px; background: var(--gold-color); color: #000; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; font-size: 16px;
        }
        .auth-btn:hover { opacity: 0.9; }

        /* Casino Shaxsiy Kabinet Ekrani */
        #casino-screen { display: none; padding: 20px; }
        .balance-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 15px 20px; border-radius: 8px;
            border: 1px solid var(--gold-color); margin-bottom: 30px;
        }
        .balance-title { font-size: 18px; font-weight: bold; color: var(--gold-color); }
        .balance-amount { font-size: 22px; font-weight: bold; }
        
        /* O'yinlar paneli */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .game-card {
            background: var(--card-bg); border: 2px solid var(--gold-color); border-radius: 12px;
            overflow: hidden; text-align: center; padding-bottom: 15px; transition: transform 0.2s;
        }
        .game-card:hover { transform: scale(1.03); }
        .game-banner {
            width: 100%; height: 180px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px #000;
            background-size: cover; background-position: center;
        }
        .bg-bb1000 { background: linear-gradient(45deg, #1e3c72, #2a5298); }
        .bg-bigger { background: linear-gradient(45deg, #d1913c, #ffd194); }
        .bg-halloween { background: linear-gradient(45deg, #0f2027, #203a43, #2c5364); }
        .game-title { font-size: 18px; font-weight: bold; margin: 15px 0 5px 0; }
        .game-provider { font-size: 12px; color: #888; margin-bottom: 15px; }
        .play-btn {
            padding: 10px 30px; background: #28a745; color: white; border: none;
            border-radius: 20px; font-weight: bold; cursor: pointer;
        }
        .play-btn:hover { background: #218838; }

        /* To'lov Modali (Kassa) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 5000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 12px;
            border: 2px solid var(--gold-color); width: 90%; max-width: 450px; position: relative;
        }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: var(--gold-color); }
        .method-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .method-btn {
            flex: 1; padding: 12px; border: 1px solid var(--gold-color); background: transparent;
            color: var(--text-color); font-weight: bold; cursor: pointer; border-radius: 6px;
        }
        .method-btn.active { background: var(--gold-color); color: #000; }
        
        /* Spinner */
        .spinner-container { display: none; flex-direction: column; align-items: center; margin: 20px 0; }
        .spinner {
            border: 4px solid rgba(255,215,0,0.1); width: 50px; height: 50px;
            border-radius: 50%; border-left-color: var(--gold-color); animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* To'lov Ma'lumotlari */
        .payment-details { display: none; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 6px; border: 1px dashed var(--gold-color); margin-top: 15px; }
        .card-number-box {
            background: #000; color: #fff; padding: 12px; font-size: 18px; text-align: center;
            letter-spacing: 2px; margin: 10px 0; cursor: pointer; border-radius: 4px; border: 1px solid #333;
        }
        .card-number-box:active { background: #222; }
        .toast {
            position: fixed; bottom: 20px; right: 20px; background: #28a745; color: white;
            padding: 12px 25px; border-radius: 6px; display: none; z-index: 10000; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. SANOQ EKRANI -->
    <div id="countdown-screen">
        <div id="brand-name">qxvBET</div>
        <div id="timer">5</div>
    </div>

    <!-- TOAST BILDIRISHNOMA -->
    <div id="toast-msg" class="toast">Nusxalandi!</div>

    <!-- ASOSIY HEADER -->
    <header>
        <div class="header-left" id="header-nav-auth">
            <button class="nav-btn" id="lbl-login-tab" onclick="switchAuthTab('login')">KIRISH</button>
            <button class="nav-btn" id="lbl-register-tab" onclick="switchAuthTab('register')">RO'YXATDAN O'TISH</button>
        </div>
        <div class="header-left" id="header-nav-profile" style="display: none;">
            <button class="nav-btn" id="lbl-deposit-trigger" onclick="openDepositModal()">PUL TUSHURISH</button>
        </div>

        <!-- O'ng tomondagi 3ta nuqta (Sozlamalar) -->
        <div class="dots-menu" onclick="toggleSettings()">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Sozlamalar menyusi -->
        <div class="settings-dropdown" id="settingsMenu">
            <h4 id="lbl-settings-title">Sozlamalar</h4>
            <label id="lbl-lang-select" style="font-size: 12px;">Tilni tanlang:</label>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="uz">UZB</option>
                <option value="eng">ENG</option>
                <option value="rus">RUS</option>
            </select>
            <label id="lbl-theme-select" style="font-size: 12px;">Fon rejimi:</label>
            <button onclick="toggleTheme()" id="lbl-theme-btn">Qora / Oq</button>
        </div>
    </header>

    <!-- 2. LOGIN / REGISTRATSIYA EKRANI -->
    <div id="auth-screen">
        <div class="auth-container">
            <h2 id="auth-title">KIRISH</h2>
            <input type="email" id="auth-email" placeholder="Email manzilingiz">
            <input type="password" id="auth-password" placeholder="Parol">
            <div class="remember-me">
                <input type="checkbox" id="auth-remember" checked>
                <label for="auth-remember" id="lbl-remember">Eslab qolish</label>
            </div>
            <button class="auth-btn" id="auth-submit-btn" onclick="handleAuth()">KIRISH</button>
        </div>
    </div>

    <!-- 3. CASINO AKKAUNT EKRANI (PRAGMATIC PLAY O'YINLARI) -->
